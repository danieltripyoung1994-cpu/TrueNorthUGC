<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>TrueNorthUGC - Canada's Premier UGC Creator Marketplace | Find Canadian Creators</title>
    <meta name="description" content="TrueNorthUGC is Canada's leading UGC creator marketplace. Connect brands with authentic Canadian content creators for user-generated content campaigns. Find creators by niche, location, and platform." />
    
    <!-- SEO Meta Tags -->
    <meta name="keywords" content="UGC creators Canada, Canadian content creators, user generated content, UGC marketplace, brand partnerships Canada, influencer marketing Canada, creator economy, Toronto creators, Vancouver creators, Montreal creators, Canadian influencers, UGC campaigns, brand collaborations" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="TrueNorthUGC" />
    <link rel="canonical" href="https://www.truenorthugc.com/" />
    
    <!-- Geographic Tags for Canadian Focus -->
    <meta name="geo.region" content="CA" />
    <meta name="geo.placename" content="Canada" />
    <meta name="language" content="English" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.truenorthugc.com/" />
    <meta property="og:title" content="TrueNorthUGC - Canada's Premier UGC Creator Marketplace" />
    <meta property="og:description" content="Connect with top Canadian UGC creators and brands. Find campaigns, build your portfolio, and grow your creator business with TrueNorthUGC." />
    <meta property="og:image" content="https://www.truenorthugc.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TrueNorthUGC - Canada's UGC Creator Marketplace" />
    <meta property="og:site_name" content="TrueNorthUGC" />
    <meta property="og:locale" content="en_CA" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.truenorthugc.com/" />
    <meta name="twitter:title" content="TrueNorthUGC - Canada's Premier UGC Creator Marketplace" />
    <meta name="twitter:description" content="Connect with top Canadian UGC creators and brands. Find campaigns, build your portfolio, and grow your creator business." />
    <meta name="twitter:image" content="https://www.truenorthugc.com/og-image.png" />
    <meta name="twitter:image:alt" content="TrueNorthUGC - Canada's UGC Creator Marketplace" />
    
    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "TrueNorthUGC",
      "url": "https://www.truenorthugc.com",
      "logo": "https://www.truenorthugc.com/logo.png",
      "description": "Canada's premier marketplace connecting brands with authentic UGC creators",
      "areaServed": {
        "@type": "Country",
        "name": "Canada"
      },
      "sameAs": []
    }
    </script>
    
    <!-- Structured Data - WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "TrueNorthUGC",
      "url": "https://www.truenorthugc.com",
      "description": "Canada's premier UGC creator marketplace",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.truenorthugc.com/creators?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
    <!-- Structured Data - Service -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "serviceType": "UGC Creator Marketplace",
      "provider": {
        "@type": "Organization",
        "name": "TrueNorthUGC"
      },
      "areaServed": {
        "@type": "Country",
        "name": "Canada"
      },
      "description": "Connect brands with Canadian UGC creators for authentic user-generated content campaigns",
      "offers": {
        "@type": "Offer",
        "description": "UGC creator discovery and campaign management"
      }
    }
    </script>
    
    <link rel="icon" type="image/png" href="/favicon.png" />
